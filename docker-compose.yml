version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ic-edu/iap-platform:v1.0.0-beta
    container_name: iap-app
    restart: always
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "https://assessment.icedu.org"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: iap_db
      DB_USERNAME: iap_user
      DB_PASSWORD: secret_password
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    container_name: iap-db
    restart: always
    environment:
      MYSQL_DATABASE: iap_db
      MYSQL_USER: iap_user
      MYSQL_PASSWORD: secret_password
      MYSQL_ROOT_PASSWORD: root_secret_password
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: iap-redis
    restart: always

volumes:
  db_data:
